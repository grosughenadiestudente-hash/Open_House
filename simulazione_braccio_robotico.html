<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Insect Robo</title>
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <script src="https://unpkg.com/aframe-teleport-controls/dist/aframe-teleport-controls.min.js"></script>
    <style>
      body { margin:0; font-family: system-ui,Segoe UI,Arial; }
      .ui { position: fixed; left: 12px; top: 12px; z-index: 10; display: flex; gap:8px; }
      .btn { background:#0b6; color:#042; border:none; padding:8px 10px; border-radius:8px; cursor:pointer; font-weight:700 }
      .btn.secondary{ background:#eef; color:#042 }
    </style>
  </head>
  <body>
    <div class="ui">
      <button id="enter-vr" class="btn">Enter VR</button>
      <button id="reset" class="btn secondary">Reset</button>
      <button id="teleport-toggle" class="btn secondary">Teleport</button>
      <button id="zoom-out" class="btn secondary">Allontana</button>
      <button id="orbit-toggle" class="btn secondary">Gira</button>
    </div>

    <a-scene id="scene" background="color: #dde8ee" renderer="antialias: true" vr-mode-ui="enabled: true">
      <a-assets>
        <!-- Placeholder GLB: Robot expressive sample -->
        <a-asset-item id="robotModel" src="https://raw.githubusercontent.com/KhronosGroup/glTF-Sample-Models/master/2.0/RobotExpressive/glTF-Binary/RobotExpressive.glb"></a-asset-item>
      </a-assets>

      <a-entity light="type: ambient; intensity: 0.9; color: #ffffff"></a-entity>
      <a-entity light="type: directional; intensity: 0.8" position="1 3 2"></a-entity>

      <a-plane id="ground" rotation="-90 0 0" width="40" height="40" color="#cfd8dc"></a-plane>

      <a-entity id="robot" position="0 0 -2" rotation="0 0 0" gltf-model="#robotModel" scale="0.6 0.6 0.6"></a-entity>

      <a-entity id="camera-rig" position="0 1.6 1.2">
        <a-entity id="main-camera" camera look-controls="reverseMouseDrag:false" wasd-controls="enabled:false">
          <a-entity cursor="rayOrigin: mouse" raycaster="objects: .teleportable"></a-entity>
        </a-entity>
      </a-entity>

      <a-entity id="left-hand" hand-controls="hand: left" teleport-controls="button: grip; collisionEntities: #ground; cameraRig: #camera-rig; teleportOrigin: #main-camera; type: parabolic; teleportDuration: 300"></a-entity>
      <a-entity id="right-hand" hand-controls="hand: right" teleport-controls="button: trigger; collisionEntities: #ground; cameraRig: #camera-rig; teleportOrigin: #main-camera; type: parabolic; teleportDuration: 300"></a-entity>

      <a-entity id="highlight" geometry="primitive: ring; radiusInner: 0.12; radiusOuter: 0.18" material="color: #5fd1ff; opacity: 0.9" rotation="-90 0 0" visible="false"></a-entity>
    </a-scene>

    <script>
      const scene = document.getElementById('scene');
      const cameraRig = document.getElementById('camera-rig');
      const mainCamera = document.getElementById('main-camera');
      const robot = document.getElementById('robot');
      const highlight = document.getElementById('highlight');

      // helpers
      const parsePos = (pos) => {
        if (typeof pos === 'string') { const [x,y,z]=pos.split(' ').map(Number); return {x,y,z}; }
        return pos;
      };

      const setCameraPos = (vec) => cameraRig.setAttribute('position', `${vec.x} ${vec.y} ${vec.z}`);

      // Enter VR
      document.getElementById('enter-vr').addEventListener('click', () => { if (scene.enterVR) scene.enterVR(); });

      // Reset
      document.getElementById('reset').addEventListener('click', () => {
        setCameraPos({ x: 0, y: 1.6, z: 1.2 });
        cameraRig.setAttribute('rotation', '0 0 0');
      });

      // Teleport toggle: enable click-to-teleport on ground and robot area
      let teleportEnabled = true;
      const teleportToggle = document.getElementById('teleport-toggle');
      teleportToggle.addEventListener('click', () => { teleportEnabled = !teleportEnabled; teleportToggle.classList.toggle('active'); });

      // show highlight on mousemove over ground
      scene.addEventListener('cursor-moved', (e) => {});

      // Use A-Frame cursor click events to teleport (fallback) and teleport-controls events
      scene.addEventListener('click', (ev) => {
        if (!teleportEnabled) return;
        // fallback teleport for desktop mouse
        const intersection = ev.detail && (ev.detail.intersection || ev.detail.intersections && ev.detail.intersections[0]);
        if (intersection && intersection.point) {
          const p = intersection.point;
          cameraRig.setAttribute('position', `${p.x} 1.6 ${p.z}`);
        }
      });

      // show/hide highlight when teleport aiming starts/ends
      scene.addEventListener('teleportstart', (e) => {
        const p = e && e.detail && e.detail.point;
        if (p) { highlight.setAttribute('position', `${p.x} 0.01 ${p.z}`); highlight.setAttribute('visible', 'true'); }
      });
      scene.addEventListener('teleportend', (e) => { highlight.setAttribute('visible', 'false'); });

      // Orbit and distance controls
      const getFocal = () => parsePos(robot.getAttribute('position') || '0 0 -2');
      const getCameraPos = () => parsePos(cameraRig.getAttribute('position'));
      const distanceBetween = (a,b)=>{const dx=a.x-b.x,dy=a.y-b.y,dz=a.z-b.z; return Math.sqrt(dx*dx+dy*dy+dz*dz);};

      const setDistanceFromFocal = (newDistance)=>{
        const focal = getFocal(); const cam = getCameraPos(); const dir = { x: cam.x - focal.x, y: cam.y - focal.y, z: cam.z - focal.z };
        const len = Math.sqrt(dir.x*dir.x + dir.y*dir.y + dir.z*dir.z) || 1;
        const nx = (dir.x / len) * newDistance; const ny = (dir.y / len) * newDistance; const nz = (dir.z / len) * newDistance;
        setCameraPos({ x: focal.x + nx, y: focal.y + ny, z: focal.z + nz });
      };

      let orbiting = false; let orbitReq = null;
      document.getElementById('zoom-out').addEventListener('click', ()=>{ const cur = distanceBetween(getCameraPos(), getFocal()); setDistanceFromFocal(Math.min(cur+0.8, 40)); });

      document.getElementById('orbit-toggle').addEventListener('click', (ev)=>{
        ev.currentTarget.classList.toggle('active');
        if (orbiting) { orbiting=false; if (orbitReq) cancelAnimationFrame(orbitReq); orbitReq=null; }
        else {
          orbiting=true; let angle=0; const focal=getFocal(); const radius=distanceBetween(getCameraPos(), focal); const camY=getCameraPos().y;
          const step=()=>{ angle+=0.01; const x=focal.x+Math.sin(angle)*radius; const z=focal.z+Math.cos(angle)*radius; setCameraPos({x,y:camY,z}); const yaw = -Math.atan2(x-focal.x, z-focal.z) * (180/Math.PI); cameraRig.setAttribute('rotation', `0 ${yaw} 0`); orbitReq=requestAnimationFrame(step); };
          orbitReq=requestAnimationFrame(step);
        }
      });

      // Joystick locomotion (gamepads)
      let lastTime = performance.now(); const moveSpeed = 2.0; const rotSpeed = 90; const deadzone = 0.15;
      const pollMove = (time)=>{
        const dt = Math.min((time-lastTime)/1000, 0.05); lastTime=time;
        const pads = navigator.getGamepads ? navigator.getGamepads() : [];
        let moveX=0, moveZ=0, yaw=0;
        for (let i=0;i<pads.length;i++){ const p=pads[i]; if(!p) continue; const axes=p.axes||[]; if(axes.length>=2){ const ax=Math.abs(axes[0])>deadzone?axes[0]:0; const ay=Math.abs(axes[1])>deadzone?axes[1]:0; moveX+=ax; moveZ+=ay; } if(axes.length>=4){ const rx=Math.abs(axes[2])>deadzone?axes[2]:0; yaw+=rx; } }
        if (Math.abs(moveX)>0 || Math.abs(moveZ)>0){ const THREE = AFRAME.THREE; const camEl = document.getElementById('main-camera'); const dir = new THREE.Vector3(); camEl.object3D.getWorldDirection(dir); dir.y=0; dir.normalize(); const right = new THREE.Vector3(); right.crossVectors(dir, new THREE.Vector3(0,1,0)).normalize(); const forwardAmount = -moveZ; const strafeAmount = moveX; const delta = new THREE.Vector3(); delta.addScaledVector(dir, forwardAmount*moveSpeed*dt); delta.addScaledVector(right, strafeAmount*moveSpeed*dt); const camPos = getCameraPos(); setCameraPos({ x: camPos.x + delta.x, y: camPos.y + delta.y, z: camPos.z + delta.z }); }
        if (Math.abs(yaw)>0){ const rot = parsePos(cameraRig.getAttribute('rotation')||'0 0 0'); const newYaw = rot.y - yaw * rotSpeed * dt; cameraRig.setAttribute('rotation', `0 ${newYaw} 0`); }
        requestAnimationFrame(pollMove);
      };
      requestAnimationFrame(pollMove);
    </script>
  </body>
</html>
