<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>iMSTK-like Needle Demo</title>
  <style>
    html,body{height:100%;margin:0;font-family:Arial}
    #ui{position:absolute;left:8px;top:8px;z-index:10;background:rgba(255,255,255,0.9);padding:8px;border-radius:6px}
    button{margin:4px}
    #canvas{display:block}
  </style>
</head>
<body>
  <div id="ui">
    <button id="play">Play</button>
    <button id="pause">Pause</button>
    <button id="export">Esporta JSON</button>
    <label>Frames: <input id="frames" type="number" value="60" min="10" max="600" style="width:64px"/></label>
    <br>
    <label><input type="checkbox" id="useExternal"> Usa `data/simulation.json` se presente</label>
    <input id="loadFile" type="file" accept="application/json" style="display:inline-block;margin-left:8px" />
  </div>
  <div id="container"></div>

  <script src="https://unpkg.com/three@0.152.0/build/three.min.js"></script>
  <script src="https://unpkg.com/three@0.152.0/examples/js/controls/OrbitControls.js"></script>
  <script>
    // Simple procedural soft-tissue + needle demo and exporter
    const container = document.getElementById('container');
    const width = window.innerWidth, height = window.innerHeight;
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(45, width/height, 0.1, 1000);
    camera.position.set(0, -6, 6);
    camera.up.set(0,0,1);
    const renderer = new THREE.WebGLRenderer({antialias:true});
    renderer.setSize(width, height);
    container.appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.target.set(0,0,0);

    const light = new THREE.DirectionalLight(0xffffff, 0.9);
    light.position.set(5,5,10);
    scene.add(light);
    scene.add(new THREE.AmbientLight(0x666666));

    // Parameters
    const NX = 40, NY = 40, SIZE = 4;
    const planeGeom = new THREE.BufferGeometry();
    const positions = new Float32Array(NX*NY*3);
    const normals = new Float32Array(NX*NY*3);
    const uvs = new Float32Array(NX*NY*2);
    let ptr = 0, ptr2 = 0;
    for(let j=0;j<NY;j++){
      for(let i=0;i<NX;i++){
        const x = (i/(NX-1)-0.5)*SIZE;
        const y = (j/(NY-1)-0.5)*SIZE;
        positions[ptr++] = x;
        positions[ptr++] = y;
        positions[ptr++] = 0;
        normals[ptr2++] = 0; normals[ptr2++] = 0; normals[ptr2++] = 1;
        const ui = i/(NX-1), vj = j/(NY-1);
        uvs[(i+j*NX)*2] = ui; uvs[(i+j*NX)*2+1] = vj;
      }
    }
    const indices = [];
    for(let j=0;j<NY-1;j++){
      for(let i=0;i<NX-1;i++){
        const a = i + j*NX;
        const b = (i+1) + j*NX;
        const c = i + (j+1)*NX;
        const d = (i+1) + (j+1)*NX;
        indices.push(a,b,c); indices.push(b,d,c);
      }
    }
    planeGeom.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    planeGeom.setAttribute('normal', new THREE.BufferAttribute(normals, 3));
    planeGeom.setAttribute('uv', new THREE.BufferAttribute(uvs, 2));
    planeGeom.setIndex(indices);
    planeGeom.computeVertexNormals();

    const mat = new THREE.MeshStandardMaterial({color:0xffb6b6, side:THREE.DoubleSide, roughness:0.9, metalness:0});
    const mesh = new THREE.Mesh(planeGeom, mat);
    scene.add(mesh);

    // Needle: line
    const needleMat = new THREE.LineBasicMaterial({color:0x2020ff});
    const needleGeom = new THREE.BufferGeometry();
    const needlePositions = new Float32Array([0,0,5, 0,0,0]);
    needleGeom.setAttribute('position', new THREE.BufferAttribute(needlePositions, 3));
    const needleLine = new THREE.Line(needleGeom, needleMat);
    scene.add(needleLine);

    // Simulation generator: returns array of frames (needle + vertex z)
    function makeSimulation(frames){
      const framesOut = [];
      for(let f=0; f<frames; f++){
        const t = f/(frames-1);
        // needle moves from z=3 down to z=-1.5
        const needleDepth = 3 - 4.5*t; // 3 -> -1.5
        const needle = {x:0, y:0, z:needleDepth};
        // deform vertices
        const zs = new Float32Array(NX*NY);
        const sigma = 0.5;
        const amp = 0.9; // max displacement
        for(let j=0;j<NY;j++){
          for(let i=0;i<NX;i++){
            const x = (i/(NX-1)-0.5)*SIZE;
            const y = (j/(NY-1)-0.5)*SIZE;
            const dx = x-needle.x, dy = y-needle.y;
            const r2 = dx*dx + dy*dy;
            // displacement proportional to how deep the needle is
            const depthFactor = Math.max(0, Math.min(1, (3 - needleDepth)/3));
            let z = -amp * Math.exp(-r2/(2*sigma*sigma)) * depthFactor;
            // if needle passed below plane, create small localized puncture
            if(needleDepth < 0 && r2 < 0.01){ z -= 0.6 * depthFactor; }
            zs[i + j*NX] = z;
          }
        }
        framesOut.push({needle, zs:Array.from(zs)});
      }
      return framesOut;
    }

    let simFrames = makeSimulation(60);
    let simMeta = { durationSec: 3 };
    let playHead = 0;
    let playing = true;

    function interpolateFrame(frameA, frameB, alpha){
      if(!frameA || !frameB){ return frameA || frameB; }
      const zs = new Array(frameA.zs.length);
      for(let i=0;i<zs.length;i++){
        zs[i] = frameA.zs[i] * (1 - alpha) + frameB.zs[i] * alpha;
      }
      return {
        needle: {
          x: frameA.needle.x * (1 - alpha) + frameB.needle.x * alpha,
          y: frameA.needle.y * (1 - alpha) + frameB.needle.y * alpha,
          z: frameA.needle.z * (1 - alpha) + frameB.needle.z * alpha
        },
        zs
      };
    }

    function sampleFrameAtTime(seconds){
      const frames = simFrames;
      if(!frames.length){ return null; }
      const duration = simMeta.durationSec || frames.length;
      const normalized = ((seconds % duration) + duration) % duration;
      const framePosition = (normalized / duration) * frames.length;
      const i0 = Math.floor(framePosition) % frames.length;
      const i1 = (i0 + 1) % frames.length;
      const alpha = framePosition - Math.floor(framePosition);
      return interpolateFrame(frames[i0], frames[i1], alpha);
    }

    function applyFrame(frame){
      if(!frame){ return; }
      // update vertex z
      const pos = planeGeom.attributes.position.array;
      let pi = 2; // z component index
      for(let k=0;k<NX*NY;k++){
        pos[pi] = frame.zs[k];
        pi += 3;
      }
      planeGeom.attributes.position.needsUpdate = true;
      planeGeom.computeVertexNormals();
      // update needle
      const np = needleGeom.attributes.position.array;
      np[0] = frame.needle.x; np[1] = frame.needle.y; np[2] = 5;
      np[3] = frame.needle.x; np[4] = frame.needle.y; np[5] = frame.needle.z;
      needleGeom.attributes.position.needsUpdate = true;
    }

    let lastTimestamp = performance.now();
    function animate(timestamp){
      requestAnimationFrame(animate);
      const dt = (timestamp - lastTimestamp) / 1000;
      lastTimestamp = timestamp;
      if(playing){ playHead += dt; }
      applyFrame(sampleFrameAtTime(playHead));
      renderer.render(scene, camera);
    }

    window.addEventListener('resize', ()=>{
      camera.aspect = window.innerWidth/window.innerHeight; camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    document.getElementById('play').addEventListener('click', ()=>{ playing=true; });
    document.getElementById('pause').addEventListener('click', ()=>{ playing=false; });
    document.getElementById('frames').addEventListener('change', (e)=>{
      const v = parseInt(e.target.value)||60; simFrames = makeSimulation(v); simMeta = { durationSec: 3 }; playHead = 0; playing=false;
    });

    // Load external JSON from local server if present
    async function tryLoadDefault(){
      try{
        const resp = await fetch('data/simulation.json');
        if(!resp.ok) return false;
        const payload = await resp.json();
        if(payload && payload.frames){
          simFrames = payload.frames;
          simMeta = payload.meta || { durationSec: 180 };
          document.getElementById('useExternal').checked = true;
          playHead = 0;
          playing = false;
          return true;
        }
      }catch(e){}
      return false;
    }

    // Load JSON from user file input
    document.getElementById('loadFile').addEventListener('change', (ev)=>{
      const f = ev.target.files[0]; if(!f) return;
      const reader = new FileReader();
      reader.onload = ()=>{
        try{
          const payload = JSON.parse(reader.result);
          if(payload && payload.frames){
            simFrames = payload.frames;
            simMeta = payload.meta || { durationSec: 180 };
            document.getElementById('useExternal').checked = true;
            playHead = 0;
            playing = false;
          }
        }
        catch(err){ alert('File JSON non valido'); }
      };
      reader.readAsText(f);
    });

    // Try to auto-load default on startup
    tryLoadDefault();

    document.getElementById('export').addEventListener('click', ()=>{
      const frames = parseInt(document.getElementById('frames').value)||60;
      const data = makeSimulation(frames);
      const payload = {meta:{nx:NX,ny:NY,size:SIZE,frames:frames,durationSec:3}, frames:data};
      const blob = new Blob([JSON.stringify(payload)], {type:'application/json'});
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a'); a.href = url; a.download = 'simulation.json'; document.body.appendChild(a); a.click(); a.remove();
      URL.revokeObjectURL(url);
    });

    // start
    animate();
  </script>
</body>
</html>
